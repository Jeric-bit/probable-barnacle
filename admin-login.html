<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Pump N' Gain Fitness Gym</title>
  <style>
    :root {
      --bg-dark: #0f0f11;
      --bg-card: #18181c;
      --text-light: #ffffff;
      --text-muted: #a0a0aa;
      --accent-yellow: #f5b014;
      --accent-red: #d92525;
      --border-color: #2a2a32;
      --font-heading: 'Impact', 'Oswald', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Segoe UI', Roboto, sans-serif;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; }
    .auth-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; width: 100%; }

    .hero-left-panel {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem;
      background-color: #000;
    }

    .hero-left-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      opacity: 0.65;
      filter: brightness(0.85) contrast(1.1);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(15, 15, 17, 0.8) 0%, rgba(15, 15, 17, 0.3) 50%, rgba(15, 15, 17, 0.95) 100%);
      z-index: 1;
    }

    .banner-brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
    }

    .banner-logo {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--accent-yellow);
      box-shadow: 0 0 15px rgba(245, 176, 20, 0.4);
    }

    .banner-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .banner-quote {
      position: relative;
      z-index: 2;
      max-width: 460px;
      margin-bottom: 1.5rem;
    }

    .banner-quote h2 {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 3.5vw, 3rem);
      line-height: 1.1;
      margin-bottom: 1rem;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .banner-quote h2 span { color: var(--accent-red); }
    .banner-quote p { color: #d1d1d6; font-size: 1.1rem; line-height: 1.5; text-shadow: 0 1px 5px rgba(0, 0, 0, 0.8); }

    .auth-form-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
      background-color: var(--bg-dark);
      position: relative;
    }

    .back-link {
      position: absolute;
      top: 2rem;
      right: 2rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .back-link:hover { color: var(--accent-yellow); }
    .auth-card { width: 100%; max-width: 400px; }
    .auth-header { margin-bottom: 2rem; text-align: left; }
    .auth-kicker { color: var(--accent-yellow); font-size: 0.75rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 0.7rem; }
    .auth-title { font-family: var(--font-heading); font-size: 2.4rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .auth-subtitle { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
    .form-group { margin-bottom: 1.4rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

    .form-control {
      width: 100%;
      padding: 0.85rem 1rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-light);
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-control:focus { outline: none; border-color: var(--accent-yellow); box-shadow: 0 0 10px rgba(245, 176, 20, 0.2); }
    .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .remember-me { display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); cursor: pointer; }
    .remember-me input { accent-color: var(--accent-yellow); width: 16px; height: 16px; }
    .forgot-link { color: var(--accent-yellow); text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 1.5rem;
    }

    .btn-submit:hover { background-color: #b81d1d; transform: translateY(-2px); }
    .auth-footer { text-align: center; color: var(--text-muted); font-size: 0.9rem; }

    @media (max-width: 900px) {
      .auth-layout { grid-template-columns: 1fr; }
      .hero-left-panel { display: none; }
      .back-link { top: 1.5rem; right: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="auth-layout">
    <div class="hero-left-panel">
      <img src="https://atlantisstrength.com/app/uploads/2025/07/dsc05377-2-1145x660.jpg" alt="Gym athlete training" class="hero-left-img">
      <div class="hero-overlay"></div>

      <a href="index.html" class="banner-brand">
        <img src="https://scontent.fmnl17-5.fna.fbcdn.net/v/t39.30808-6/383822240_122102110454052375_2515101282174353432_n.jpg?stp=dst-jpg_tt6&cstp=mx1772x1772&ctp=s1772x1772&_nc_cat=110&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_eui2=AeG5AEf_mfjT69M2hR0YdEHXWURDTUvB5Q1ZRENNS8HlDRfk5_a-f3gI7peeexWqECRnsY-1joay_j0c-gG07LZJ&_nc_ohc=c0mUuFnewrYQ7kNvwHuDktT&_nc_oc=AdrrnG0bRzIlsHqI62qHyxDdxpaij9tYtUF69nEaPIKUvScxTBojEqrt7OoZAqU5zOo&_nc_zt=23&_nc_ht=scontent.fmnl17-5.fna&_nc_gid=rym9MNF1LZzMUZe2kjhsug&_nc_ss=7b2a8&oh=00_AQOFskUMeOm0wb-5XaPvyT5iugWrZ2bM4dhH-3Nt7QlwhA&oe=6AD2BDE6" alt="Pump N' Gain logo" class="banner-logo">
        <span class="banner-title">PUMP N' GAIN</span>
      </a>

      <div class="banner-quote">
        <h2>WELCOME <span>BACK, COACH.</span></h2>
        <p>Your command center is ready. Sign in to manage members, attendance, payments, and gym operations.</p>
      </div>
    </div>

    <div class="auth-form-container">
      <a href="index.html" class="back-link">Back to Home</a>

      <div class="auth-card">
        <div class="auth-header">
          <p class="auth-kicker">Staff-only access</p>
          <h1 class="auth-title">ADMIN LOGIN</h1>
          <p class="auth-subtitle">Use your administrator credentials to access the Pump N' Gain operations portal.</p>
        </div>

        <form action="#" method="POST" onsubmit="event.preventDefault(); localStorage.setItem('adminAuthenticated', 'true'); window.location.href='admin/dashboard.html';">
          <div class="form-group">
            <label for="admin-email">Work email</label>
            <input type="email" id="admin-email" class="form-control" placeholder="admin@pumpngain.com" required autofocus>
          </div>

          <div class="form-group">
            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" class="form-control" placeholder="Enter your password" required>
          </div>

          <div class="form-options">
            <label class="remember-me"><input type="checkbox"> Remember me</label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-submit">ENTER ADMIN PORTAL</button>
        </form>

      </div>
    </div>
  </div>
</body>
</html>
