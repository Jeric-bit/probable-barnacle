<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Pump N' Gain Fitness Gym</title>
  <style>
    :root {
      --bg-dark: #0f0f11;
      --bg-card: #18181c;
      --text-light: #ffffff;
      --text-muted: #a0a0aa;
      --accent-yellow: #f5b014;
      --accent-red: #d92525;
      --border-color: #2a2a32;
      --font-heading: 'Impact', 'Oswald', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Segoe UI', Roboto, sans-serif;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    .auth-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      width: 100%;
    }

    /* ==========================================
       LEFT HERO IMAGE CONTAINER
       ========================================== */
    .hero-left-panel {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem;
      background-color: #000;
    }

    /* Hero Background Image */
    .hero-left-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      opacity: 0.65;
      filter: brightness(0.85) contrast(1.1);
      transition: var(--transition);
    }

    /* Dark gradient overlay on top of the hero image */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(15, 15, 17, 0.8) 0%, rgba(15, 15, 17, 0.3) 50%, rgba(15, 15, 17, 0.95) 100%);
      z-index: 1;
    }

    /* Content layers above hero image */
    .banner-brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
    }

    .banner-logo {
      height: 55px;
      width: auto;
      border-radius: 50%;
      border: 2px solid var(--accent-yellow);
      box-shadow: 0 0 15px rgba(245, 176, 20, 0.4);
    }

    .banner-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      color: #fff;
      letter-spacing: 1px;
    }

    .banner-quote {
      position: relative;
      z-index: 2;
      max-width: 460px;
      margin-bottom: 1.5rem;
    }

    .banner-quote h2 {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 3.5vw, 3rem);
      line-height: 1.1;
      margin-bottom: 1rem;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .banner-quote h2 span {
      color: var(--accent-red);
    }

    .banner-quote p {
      color: #d1d1d6;
      font-size: 1.1rem;
      line-height: 1.5;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.8);
    }

    /* ==========================================
       RIGHT FORM PANEL
       ========================================== */
    .auth-form-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
      background-color: var(--bg-dark);
      position: relative;
    }

    .back-link {
      position: absolute;
      top: 2rem;
      right: 2rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
    }

    .back-link:hover {
      color: var(--accent-yellow);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
    }

    .auth-header {
      margin-bottom: 1.8rem;
      text-align: left;
    }

    .auth-title {
      font-family: var(--font-heading);
      font-size: 2.4rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-light);
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-yellow);
      box-shadow: 0 0 10px rgba(245, 176, 20, 0.2);
    }

    select.form-control {
      cursor: pointer;
    }

    .terms-group {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin: 1.2rem 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .terms-group input {
      accent-color: var(--accent-yellow);
      margin-top: 0.2rem;
      width: 16px;
      height: 16px;
    }

    .terms-group a {
      color: var(--accent-yellow);
      text-decoration: none;
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background-color: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 1.5rem;
    }

    .btn-submit:hover {
      background-color: #b81d1d;
      transform: translateY(-2px);
    }

    .auth-footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .auth-footer a {
      color: var(--accent-yellow);
      text-decoration: none;
      font-weight: bold;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .auth-layout {
        grid-template-columns: 1fr;
      }

      .hero-left-panel {
        display: none;
      }

      .back-link {
        top: 1.5rem;
        right: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="auth-layout">
    <!-- LEFT PANEL WITH FEATURED HERO IMAGE -->
    <div class="hero-left-panel">
      <!-- 1. Hero Image (Replace 'src' with your image file if needed) -->
      <img src="https://atlantisstrength.com/app/uploads/2025/07/dsc05377-2-1145x660.jpg"
        alt="Gym Bodybuilding Hero Image" class="hero-left-img">
      <div class="hero-overlay"></div>

      <!-- 2. Logo Header Overlay -->
      <a href="index.html" class="banner-brand">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBizrfqq7RZpkCqczR6anacDxV1KpKpKRwJlIwEQtt2vnMMoKPJU8Z6pA&s=10"
          alt="Pump N' Gain Logo" class="banner-logo">
        <span class="banner-title">PUMP N' GAIN</span>
      </a>

      <!-- 3. Motivational Text Overlay -->
      <div class="banner-quote">
        <h2>START YOUR <span>JOURNEY TODAY.</span></h2>
        <p>No excuses. Join Pump N' Gain Fitness Gym to access world-class facilities, elite coaching, and a vibrant gym
          community.</p>
      </div>
    </div>

    <!-- RIGHT SIGN UP FORM PANEL -->
    <div class="auth-form-container">
      <a href="index.html" class="back-link">← Back to Home</a>

      <div class="auth-card">
        <div class="auth-header">
          <h1 class="auth-title">CREATE ACCOUNT</h1>
          <p class="auth-subtitle">Fill in your details to start your membership</p>
        </div>

        <form action="#" method="POST"
          onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='signin.html';">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required autofocus>
          </div>

          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-control" placeholder="At least 8 characters"
              minlength="8" required>
          </div>

          <div class="form-group">
            <label for="signup-plan">Select Plan</label>
            <select id="signup-plan" class="form-control" required>
              <option value="daypass">Day Pass ($15 / day)</option>
              <option value="monthly" selected>Monthly Pro ($49 / month)</option>
              <option value="annual">Annual VIP ($399 / year)</option>
            </select>
          </div>

          <div class="terms-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy
                Policy</a>.</label>
          </div>

          <button type="submit" class="btn-submit">CREATE ACCOUNT</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="signin.html">SIGN IN</a>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
